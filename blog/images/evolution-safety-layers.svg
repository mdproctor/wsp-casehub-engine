<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ring { fill: none; stroke-width: 2; }
    .ring-text { font-size: 13px; fill: #1e293b; font-weight: 600; }
    .ring-sub { font-size: 11px; fill: #475569; }
    .title { font-size: 16px; fill: #0f172a; font-weight: 700; }
    .core-label { font-size: 13px; fill: white; font-weight: 700; text-anchor: middle; }
    .core-sub { font-size: 10px; fill: #e2e8f0; text-anchor: middle; }
  </style>

  <text x="360" y="28" class="title" text-anchor="middle">Data Autophagy Defense Layers</text>

  <!-- Outermost ring: Structural deny list -->
  <ellipse cx="360" cy="230" rx="330" ry="170" class="ring" stroke="#94a3b8" stroke-dasharray="8 4"/>
  <text x="360" y="78" class="ring-text" text-anchor="middle">Structural Deny List</text>
  <text x="360" y="94" class="ring-sub" text-anchor="middle">Cannot modify its own safety: EvolutionTicker, CircuitBreaker,</text>
  <text x="360" y="108" class="ring-sub" text-anchor="middle">RegressionDetector, ConfidenceScorer, HealthScoreTracker...</text>

  <!-- Ring 2: Circuit breaker -->
  <ellipse cx="360" cy="240" rx="250" ry="120" class="ring" stroke="#d97706"/>
  <text x="360" y="138" class="ring-text" text-anchor="middle" style="fill:#92400e">Circuit Breaker</text>
  <text x="360" y="154" class="ring-sub" text-anchor="middle">Trips OPEN when aggregate health degrades — blocks ALL improvements</text>
  <text x="360" y="170" class="ring-sub" text-anchor="middle">Hysteresis prevents threshold oscillation</text>

  <!-- Ring 3: Category suppression -->
  <ellipse cx="360" cy="245" rx="170" ry="75" class="ring" stroke="#ea580c"/>
  <text x="360" y="188" class="ring-text" text-anchor="middle" style="fill:#9a3412">Category Suppression</text>
  <text x="360" y="204" class="ring-sub" text-anchor="middle">3 failures or 3 rejections → category paused</text>

  <!-- Ring 4: Regression detection -->
  <ellipse cx="360" cy="250" rx="100" ry="45" class="ring" stroke="#dc2626"/>
  <text x="360" y="222" class="ring-text" text-anchor="middle" style="fill:#991b1b">Regression Detection</text>
  <text x="360" y="238" class="ring-sub" text-anchor="middle">Per-improvement monitoring</text>

  <!-- Core: Improvement -->
  <ellipse cx="360" cy="265" rx="55" ry="22" fill="#1e40af"/>
  <text x="360" y="263" class="core-label">Improvement</text>
  <text x="360" y="276" class="core-sub">executes here</text>

  <!-- Response tiers -->
  <rect x="30" y="385" width="200" height="80" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="130" y="407" class="ring-text" text-anchor="middle" style="fill:#991b1b">High confidence (≥0.9)</text>
  <text x="130" y="424" class="ring-sub" text-anchor="middle">Auto-rollback case spawned</text>
  <text x="130" y="440" class="ring-sub" text-anchor="middle">Category paused</text>
  <text x="130" y="456" class="ring-sub" text-anchor="middle">Anti-cascade check first</text>

  <rect x="260" y="385" width="200" height="80" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="360" y="407" class="ring-text" text-anchor="middle" style="fill:#92400e">Medium confidence (≥0.5)</text>
  <text x="360" y="424" class="ring-sub" text-anchor="middle">Signal emitted</text>
  <text x="360" y="440" class="ring-sub" text-anchor="middle">Category paused</text>
  <text x="360" y="456" class="ring-sub" text-anchor="middle">No auto-rollback</text>

  <rect x="490" y="385" width="200" height="80" rx="6" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="590" y="407" class="ring-text" text-anchor="middle" style="fill:#1e40af">Low confidence (&lt;0.5)</text>
  <text x="590" y="424" class="ring-sub" text-anchor="middle">Signal only</text>
  <text x="590" y="440" class="ring-sub" text-anchor="middle">CBR trace enriched</text>
  <text x="590" y="456" class="ring-sub" text-anchor="middle">No category pause</text>

  <!-- Divider line -->
  <line x1="60" y1="370" x2="660" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="365" class="ring-sub" text-anchor="middle" style="font-weight:600;fill:#64748b">Regression response tiers</text>
</svg>
