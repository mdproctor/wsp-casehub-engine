<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="340" fill="#f8fafc" rx="8"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Coordination Overlays the Worker Layer</text>

  <!-- Coordination layer -->
  <rect x="40" y="50" width="520" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="300" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Coordination Vocabulary</text>
  <text x="300" y="94" text-anchor="middle" font-size="11" fill="#475569">TopologyType  |  DecisionScope  |  StructuralRole  |  AgentRole</text>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#475569">How agents relate structurally — who delegates to whom</text>

  <!-- Arrow down -->
  <text x="300" y="150" text-anchor="middle" font-size="18" fill="#64748b">overlays</text>

  <!-- Worker layer -->
  <rect x="40" y="170" width="520" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Worker Layer</text>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#475569">Worker  |  WorkerFunction  |  AgentWorkerFunction  |  AgentWorkState</text>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#475569">What agents ARE — execution identity, tied to Work infrastructure</text>

  <!-- Worker specialisations -->
  <rect x="60" y="270" width="100" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="110" y="292" text-anchor="middle" font-size="10" fill="#14532d">FlowWorker</text>

  <rect x="176" y="270" width="100" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="226" y="292" text-anchor="middle" font-size="10" fill="#14532d">PlaybookWorker</text>

  <rect x="292" y="270" width="100" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="342" y="292" text-anchor="middle" font-size="10" fill="#14532d">CamelWorker</text>

  <rect x="408" y="270" width="120" height="36" rx="4" fill="#f0fdf4" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="468" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">AgentWorker</text>

  <text x="300" y="328" text-anchor="middle" font-size="10" fill="#94a3b8">An agent in a topology IS an AgentWorker — coordination describes how, Worker describes what</text>
</svg>
