<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Quorum Coordination — Before and After</text>

  <!-- Left column: Before -->
  <text x="180" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#666">Before #1257</text>

  <!-- Compound MofN box -->
  <rect x="40" y="80" width="280" height="70" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="180" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1a73e8">CompletionSemantics.MofN</text>
  <text x="180" y="118" text-anchor="middle" font-size="10" fill="#555">"When is this compound done?"</text>
  <text x="180" y="134" text-anchor="middle" font-size="10" fill="#555">Gates compound completion, not dispatch</text>

  <!-- SubCase MofN box -->
  <rect x="40" y="165" width="280" height="55" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="180" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#1a73e8">SubCase Group M-of-N</text>
  <text x="180" y="203" text-anchor="middle" font-size="10" fill="#555">Gates child case completion</text>

  <!-- Action Gate box -->
  <rect x="40" y="235" width="280" height="55" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="180" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#1a73e8">QuorumConfig (Action Gates)</text>
  <text x="180" y="273" text-anchor="middle" font-size="10" fill="#555">Gates human approval</text>

  <!-- Gap indicator -->
  <rect x="40" y="305" width="280" height="55" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="180" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#d93025">Binding-Level Barrier</text>
  <text x="180" y="343" text-anchor="middle" font-size="10" fill="#d93025">"Wait for 2 of 3 workers" — MISSING</text>

  <!-- Right column: After -->
  <text x="540" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#666">After #1257</text>

  <!-- Compound MofN box (kept) -->
  <rect x="400" y="80" width="280" height="55" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="540" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1a73e8">CompletionSemantics.MofN</text>
  <text x="540" y="118" text-anchor="middle" font-size="10" fill="#555">+ YAML wiring fixed</text>

  <!-- SubCase MofN box (kept) -->
  <rect x="400" y="148" width="280" height="45" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="540" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#1a73e8">SubCase Group M-of-N (unchanged)</text>

  <!-- Action Gate box (kept) -->
  <rect x="400" y="206" width="280" height="45" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="540" y="233" text-anchor="middle" font-size="11" font-weight="500" fill="#1a73e8">QuorumConfig (unchanged)</text>

  <!-- NEW: Binding-level requires -->
  <rect x="400" y="268" width="280" height="90" rx="6" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
  <text x="540" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#137333">NEW: requires Guard</text>
  <text x="540" y="308" text-anchor="middle" font-size="10" fill="#137333">"Don't fire until 2 of 3 extractors complete"</text>
  <text x="540" y="326" text-anchor="middle" font-size="10" fill="#555">Pre-strategy filter in PlanningStrategyLoopControl</text>
  <text x="540" y="344" text-anchor="middle" font-size="10" fill="#555">CANCEL + unreachable quorum detection</text>

  <!-- Arrow from gap to new -->
  <line x1="320" y1="332" x2="398" y2="313" stroke="#137333" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#137333"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="360" y="400" text-anchor="middle" font-size="9" fill="#999">casehubio/engine#1257 — Quorum Coordination Primitive</text>
</svg>
