<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Main branch -->
  <line x1="40" y1="50" x2="640" y2="50" stroke="#059669" stroke-width="2.5"/>
  <text x="30" y="54" text-anchor="end" font-weight="600" fill="#059669" font-size="13">main</text>
  <circle cx="120" cy="50" r="4" fill="#059669"/>
  <circle cx="280" cy="50" r="4" fill="#059669"/>
  <circle cx="440" cy="50" r="4" fill="#059669"/>
  <circle cx="580" cy="50" r="4" fill="#059669"/>

  <!-- Branch 1 — code merged, artifacts left behind -->
  <line x1="120" y1="50" x2="180" y2="110" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="180" y1="110" x2="260" y2="110" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="260" y1="110" x2="280" y2="50" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="200" cy="110" r="3" fill="#6366f1"/>
  <circle cx="240" cy="110" r="3" fill="#6366f1"/>
  <text x="220" y="100" text-anchor="middle" fill="#4f46e5" font-size="10">branch A</text>

  <!-- Artifacts on branch 1 -->
  <rect x="185" y="125" width="70" height="18" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="220" y="137" text-anchor="middle" fill="#92400e" font-size="9">spec, blog</text>
  <text x="220" y="155" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="600">← stranded</text>

  <!-- Branch 2 -->
  <line x1="280" y1="50" x2="340" y2="110" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="340" y1="110" x2="420" y2="110" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="420" y1="110" x2="440" y2="50" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="360" cy="110" r="3" fill="#6366f1"/>
  <circle cx="400" cy="110" r="3" fill="#6366f1"/>
  <text x="380" y="100" text-anchor="middle" fill="#4f46e5" font-size="10">branch B</text>

  <!-- Artifacts on branch 2 -->
  <rect x="345" y="125" width="70" height="18" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="380" y="137" text-anchor="middle" fill="#92400e" font-size="9">decisions</text>
  <text x="380" y="155" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="600">← stranded</text>

  <!-- Branch 3 -->
  <line x1="440" y1="50" x2="500" y2="110" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="500" y1="110" x2="560" y2="110" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="560" y1="110" x2="580" y2="50" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="520" cy="110" r="3" fill="#6366f1"/>
  <circle cx="550" cy="110" r="3" fill="#6366f1"/>
  <text x="530" y="100" text-anchor="middle" fill="#4f46e5" font-size="10">branch C</text>

  <rect x="505" y="125" width="70" height="18" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
  <text x="540" y="137" text-anchor="middle" fill="#92400e" font-size="9">3 blogs</text>
  <text x="540" y="155" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="600">← stranded</text>

  <!-- Accumulation arrow -->
  <path d="M160,185 Q340,210 560,185" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="360" y="210" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">93 branches × ~7 files = 1,067 stranded artifacts</text>

  <!-- Bottom: what main sees -->
  <rect x="140" y="235" width="400" height="45" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="340" y="253" text-anchor="middle" fill="#374151" font-size="11">main sees: code changes only</text>
  <text x="340" y="268" text-anchor="middle" fill="#6b7280" font-size="10">specs, blogs, decisions, explorations — invisible</text>
</svg>
