<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Before: Silent Agent Death</text>

  <!-- Timeline -->
  <line x1="60" y1="80" x2="680" y2="80" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="84" text-anchor="end" font-size="11" fill="#888">time</text>

  <!-- Agent A - healthy -->
  <rect x="80" y="100" width="120" height="40" rx="6" fill="#4CAF50" opacity="0.15" stroke="#4CAF50"/>
  <text x="140" y="124" text-anchor="middle" fill="#2E7D32" font-size="12">Agent A: LLM</text>

  <rect x="210" y="100" width="120" height="40" rx="6" fill="#4CAF50" opacity="0.15" stroke="#4CAF50"/>
  <text x="270" y="124" text-anchor="middle" fill="#2E7D32" font-size="12">Agent A: LLM</text>

  <rect x="340" y="100" width="120" height="40" rx="6" fill="#4CAF50" opacity="0.15" stroke="#4CAF50"/>
  <text x="400" y="124" text-anchor="middle" fill="#2E7D32" font-size="12">Agent A: LLM</text>

  <!-- Agent B - dies -->
  <rect x="80" y="160" width="120" height="40" rx="6" fill="#4CAF50" opacity="0.15" stroke="#4CAF50"/>
  <text x="140" y="184" text-anchor="middle" fill="#2E7D32" font-size="12">Agent B: LLM</text>

  <rect x="210" y="160" width="120" height="40" rx="6" fill="#F44336" opacity="0.15" stroke="#F44336"/>
  <text x="270" y="178" text-anchor="middle" fill="#C62828" font-size="12">Budget</text>
  <text x="270" y="192" text-anchor="middle" fill="#C62828" font-size="12">exhausted</text>

  <!-- Dead zone -->
  <rect x="340" y="160" width="320" height="40" rx="6" fill="#9E9E9E" opacity="0.08" stroke="#BDBDBD" stroke-dasharray="6,3"/>
  <text x="500" y="184" text-anchor="middle" fill="#9E9E9E" font-size="12" font-style="italic">tick() silently skipped... forever</text>

  <!-- Agent C - dies later -->
  <rect x="80" y="220" width="250" height="40" rx="6" fill="#4CAF50" opacity="0.15" stroke="#4CAF50"/>
  <text x="205" y="244" text-anchor="middle" fill="#2E7D32" font-size="12">Agent C: LLM</text>

  <rect x="340" y="220" width="320" height="40" rx="6" fill="#9E9E9E" opacity="0.08" stroke="#BDBDBD" stroke-dasharray="6,3"/>
  <text x="500" y="244" text-anchor="middle" fill="#9E9E9E" font-size="12" font-style="italic">tick() silently skipped... forever</text>

  <!-- Labels -->
  <text x="40" y="124" text-anchor="end" font-size="11" fill="#666">A</text>
  <text x="40" y="184" text-anchor="end" font-size="11" fill="#666">B</text>
  <text x="40" y="244" text-anchor="end" font-size="11" fill="#666">C</text>
</svg>
