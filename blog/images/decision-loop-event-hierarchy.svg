<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafaf9" rx="6"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">DecisionLoopEvent sealed hierarchy</text>

  <!-- Root interface -->
  <rect x="260" y="48" width="200" height="36" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="360" y="71" text-anchor="middle" font-size="12" font-weight="600" fill="#312e81">DecisionLoopEvent</text>
  <text x="360" y="96" text-anchor="middle" font-size="10" fill="#64748b">caseId / agentId / timestamp</text>

  <!-- Lifecycle events (left column) -->
  <rect x="40" y="130" width="170" height="32" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="125" y="151" text-anchor="middle" font-size="11" fill="#166534">LoopTriggered</text>

  <rect x="40" y="180" width="170" height="32" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="125" y="201" text-anchor="middle" font-size="11" fill="#166534">ObservationGathered</text>

  <!-- Reasoning events (center column) -->
  <rect x="275" y="130" width="170" height="32" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="360" y="151" text-anchor="middle" font-size="11" fill="#1e40af">ReasoningStarted</text>

  <rect x="275" y="180" width="170" height="32" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="360" y="201" text-anchor="middle" font-size="11" fill="#1e40af">ReasoningCompleted</text>
  <text x="360" y="225" text-anchor="middle" font-size="9" fill="#64748b">tokens / latencyMs / correlationId</text>

  <!-- Failure events (right column) -->
  <rect x="510" y="130" width="170" height="32" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="595" y="151" text-anchor="middle" font-size="11" fill="#991b1b">BudgetExhausted</text>

  <rect x="510" y="180" width="170" height="32" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="595" y="201" text-anchor="middle" font-size="11" fill="#991b1b">Degraded</text>

  <rect x="510" y="240" width="170" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="595" y="261" text-anchor="middle" font-size="11" fill="#92400e">ActionDispatched</text>

  <!-- Connection lines from root -->
  <line x1="310" y1="84" x2="125" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="84" x2="360" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="410" y1="84" x2="595" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- OTel metrics section -->
  <rect x="40" y="290" width="640" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">MetricsListener OTel metrics</text>

  <text x="80" y="340" font-size="10" fill="#475569">casehub.agentic.loop.triggers</text>
  <text x="80" y="358" font-size="9" fill="#94a3b8">counter / agent + scope</text>

  <text x="290" y="340" font-size="10" fill="#475569">casehub.agentic.loop.reasoning.duration</text>
  <text x="290" y="358" font-size="9" fill="#94a3b8">histogram / ms per invocation</text>

  <text x="530" y="340" font-size="10" fill="#475569">casehub.agentic.loop.reasoning.tokens</text>
  <text x="530" y="358" font-size="9" fill="#94a3b8">histogram / tokens per invocation</text>

  <text x="165" y="385" font-size="10" fill="#475569">casehub.agentic.loop.budget.exhaustions</text>
  <text x="165" y="400" font-size="9" fill="#94a3b8">counter / agent</text>

  <text x="460" y="385" font-size="10" fill="#475569">casehub.agentic.loop.degradations</text>
  <text x="460" y="400" font-size="9" fill="#94a3b8">counter / agent + capability</text>

  <!-- Arrows from events to metrics -->
  <line x1="125" y1="212" x2="125" y2="287" stroke="#22c55e" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="225" x2="360" y2="287" stroke="#3b82f6" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="595" y1="212" x2="595" y2="287" stroke="#ef4444" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Column labels -->
  <text x="125" y="122" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">LIFECYCLE</text>
  <text x="360" y="122" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">REASONING</text>
  <text x="595" y="122" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">FAILURE</text>
</svg>
