<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
  </defs>

  <style>
    .box { rx: 8; ry: 8; stroke-width: 2; }
    .connected { fill: #dbeafe; stroke: #3b82f6; }
    .disconnected { fill: #fef2f2; stroke: #dc2626; stroke-dasharray: 6 4; }
    .label { font-size: 13px; fill: #1e293b; font-weight: 600; text-anchor: middle; }
    .sublabel { font-size: 11px; fill: #64748b; text-anchor: middle; }
    .status { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .status-ok { fill: #16a34a; }
    .status-dead { fill: #dc2626; }
    .title { font-size: 18px; fill: #0f172a; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #64748b; }
  </style>

  <text x="360" y="30" class="title" text-anchor="middle">The Open Loop</text>
  <text x="360" y="50" class="subtitle" text-anchor="middle">Components exist but production wiring is disconnected</text>

  <!-- Convergence Handler -->
  <rect x="30" y="80" width="160" height="60" class="box connected"/>
  <text x="110" y="108" class="label">Convergence</text>
  <text x="110" y="124" class="sublabel">Handler</text>

  <!-- Arrow: Handler bypasses Ticker -->
  <line x1="190" y1="110" x2="410" y2="110" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="300" y="100" class="status status-dead" text-anchor="middle">BYPASSES</text>

  <!-- EvolutionTicker -->
  <rect x="220" y="170" width="160" height="60" class="box disconnected"/>
  <text x="300" y="198" class="label">EvolutionTicker</text>
  <text x="300" y="214" class="sublabel">gate pipeline</text>
  <text x="300" y="250" class="status status-dead">DEAD CODE</text>

  <!-- GoalFormation -->
  <rect x="420" y="80" width="160" height="60" class="box connected"/>
  <text x="500" y="108" class="label">Goal Formation</text>
  <text x="500" y="124" class="sublabel">proposeImprovements()</text>

  <!-- Improvement Case -->
  <rect x="420" y="170" width="160" height="60" class="box connected"/>
  <text x="500" y="198" class="label">Improvement Case</text>
  <text x="500" y="214" class="sublabel">11-stage lifecycle</text>

  <!-- Arrow down from GoalFormation -->
  <line x1="500" y1="140" x2="500" y2="170" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-grey)"/>

  <!-- Outcome Capture -->
  <rect x="420" y="280" width="160" height="60" class="box disconnected"/>
  <text x="500" y="308" class="label">Outcome Capture</text>
  <text x="500" y="324" class="sublabel">6 layers</text>
  <text x="500" y="360" class="status status-dead">NOT A CDI BEAN</text>

  <!-- Arrow from case to outcome (broken) -->
  <line x1="500" y1="230" x2="500" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="570" y="260" class="status status-dead">NO EVENT</text>

  <!-- Safety gates (inside ticker, greyed out) -->
  <rect x="30" y="170" width="160" height="60" class="box disconnected"/>
  <text x="110" y="192" class="label" style="fill:#9ca3af">Circuit Breaker</text>
  <text x="110" y="208" class="sublabel">Health / Regression</text>
  <text x="110" y="250" class="status status-dead">NEVER EVALUATED</text>

  <!-- Feedback arrow (broken) -->
  <path d="M 420 310 Q 200 310 110 250" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="240" y="330" class="status status-dead">FEEDBACK NEVER FLOWS</text>

  <!-- Timer -->
  <rect x="30" y="280" width="160" height="60" class="box disconnected"/>
  <text x="110" y="308" class="label" style="fill:#9ca3af">Timer Backstop</text>
  <text x="110" y="324" class="sublabel">@Scheduled</text>
  <text x="110" y="360" class="status status-dead">DOESN'T EXIST</text>
</svg>
