<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-signal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Hive Mind Coordination — Three Layers</text>

  <!-- Layer 1: Engine Mechanics -->
  <rect x="40" y="52" width="640" height="120" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="72" font-size="12" font-weight="600" fill="#475569">ENGINE — Deterministic Mechanics</text>

  <!-- Signal Space -->
  <rect x="60" y="84" width="130" height="72" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="125" y="104" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Signal Space</text>
  <text x="125" y="120" text-anchor="middle" font-size="9" fill="#64748b">deposit / perceive</text>
  <text x="125" y="134" text-anchor="middle" font-size="9" fill="#f59e0b">ρ(t) = s·e^(−λt)</text>
  <text x="125" y="148" text-anchor="middle" font-size="9" fill="#64748b">half-life decay</text>

  <!-- Observation Registry -->
  <rect x="210" y="84" width="130" height="72" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="275" y="104" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Observation</text>
  <text x="275" y="120" text-anchor="middle" font-size="9" fill="#64748b">interests / observers</text>
  <text x="275" y="134" text-anchor="middle" font-size="9" fill="#64748b">threshold / temporal</text>
  <text x="275" y="148" text-anchor="middle" font-size="9" fill="#64748b">correlation patterns</text>

  <!-- Neighbor Space -->
  <rect x="360" y="84" width="130" height="72" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="425" y="104" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Neighbor Space</text>
  <text x="425" y="120" text-anchor="middle" font-size="9" fill="#64748b">discovery / topology</text>
  <text x="425" y="134" text-anchor="middle" font-size="9" fill="#64748b">shared interests</text>
  <text x="425" y="148" text-anchor="middle" font-size="9" fill="#64748b">complementary skills</text>

  <!-- Convergence -->
  <rect x="510" y="84" width="150" height="72" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="585" y="104" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Convergence</text>
  <text x="585" y="120" text-anchor="middle" font-size="9" fill="#64748b">consensus detection</text>
  <text x="585" y="134" text-anchor="middle" font-size="9" fill="#64748b">storm detection</text>
  <text x="585" y="148" text-anchor="middle" font-size="9" fill="#64748b">runaway prevention</text>

  <!-- Layer 2: Execution Models -->
  <rect x="40" y="190" width="640" height="100" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="60" y="210" font-size="12" font-weight="600" fill="#1e40af">COORDINATION — Execution Models</text>

  <!-- Stigmergy -->
  <rect x="60" y="222" width="200" height="52" rx="4" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="160" y="242" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">Stigmergy</text>
  <text x="160" y="258" text-anchor="middle" font-size="9" fill="#64748b">indirect coordination via shared environment</text>

  <!-- Swarm -->
  <rect x="280" y="222" width="200" height="52" rx="4" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="380" y="242" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">Swarm</text>
  <text x="380" y="258" text-anchor="middle" font-size="9" fill="#64748b">self-organizing teams + role emergence</text>

  <!-- Self-Provisioning -->
  <rect x="500" y="222" width="160" height="52" rx="4" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="580" y="242" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">Self-Provisioning</text>
  <text x="580" y="258" text-anchor="middle" font-size="9" fill="#64748b">dynamic agent scaling</text>

  <!-- Layer 3: Intelligence -->
  <rect x="40" y="308" width="640" height="100" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="328" font-size="12" font-weight="600" fill="#92400e">AGENCY — LLM Intelligence (pluggable)</text>

  <!-- LLM Observation -->
  <rect x="60" y="340" width="200" height="52" rx="4" fill="#fff" stroke="#fbbf24" stroke-width="1"/>
  <text x="160" y="360" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">LLM Observation</text>
  <text x="160" y="376" text-anchor="middle" font-size="9" fill="#64748b">semantic pattern detection</text>

  <!-- LLM Swarm -->
  <rect x="280" y="340" width="200" height="52" rx="4" fill="#fff" stroke="#fbbf24" stroke-width="1"/>
  <text x="380" y="360" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">LLM Coordination</text>
  <text x="380" y="376" text-anchor="middle" font-size="9" fill="#64748b">experience replay from CBR traces</text>

  <!-- Evolution -->
  <rect x="500" y="340" width="160" height="52" rx="4" fill="#fff" stroke="#fbbf24" stroke-width="1"/>
  <text x="580" y="360" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">Evolution Loop</text>
  <text x="580" y="376" text-anchor="middle" font-size="9" fill="#64748b">self-improvement + rollback</text>

  <!-- Connecting arrows between layers -->
  <line x1="125" y1="156" x2="125" y2="222" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="275" y1="156" x2="275" y2="222" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="425" y1="156" x2="425" y2="222" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="585" y1="156" x2="585" y2="222" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="160" y1="274" x2="160" y2="340" stroke="#fbbf24" stroke-width="1" marker-end="url(#arrow-signal)"/>
  <line x1="380" y1="274" x2="380" y2="340" stroke="#fbbf24" stroke-width="1" marker-end="url(#arrow-signal)"/>
  <line x1="580" y1="274" x2="580" y2="340" stroke="#fbbf24" stroke-width="1" marker-end="url(#arrow-signal)"/>

  <!-- Cross-repo labels -->
  <text x="60" y="440" font-size="10" fill="#64748b">Cross-repo:</text>
  <rect x="130" y="428" width="80" height="20" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="170" y="442" text-anchor="middle" font-size="9" fill="#0369a1">neocortex</text>
  <rect x="220" y="428" width="60" height="20" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="250" y="442" text-anchor="middle" font-size="9" fill="#0369a1">eidos</text>
  <rect x="290" y="428" width="60" height="20" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="320" y="442" text-anchor="middle" font-size="9" fill="#0369a1">ledger</text>
  <rect x="360" y="428" width="50" height="20" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="385" y="442" text-anchor="middle" font-size="9" fill="#0369a1">work</text>
  <rect x="420" y="428" width="60" height="20" rx="3" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="450" y="442" text-anchor="middle" font-size="9" fill="#0369a1">qhorus</text>

  <!-- Legend -->
  <rect x="520" y="425" width="10" height="10" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="536" y="434" font-size="9" fill="#64748b">Delivered</text>
  <text x="360" y="470" text-anchor="middle" font-size="9" fill="#94a3b8">All 15 child issues delivered across engine, agency, eidos, qhorus</text>
</svg>
