<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="680" height="360" fill="#f8fafc" rx="8"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Two Orthogonal Enforcement Dimensions</text>

  <!-- Structural Authority (left) -->
  <rect x="30" y="50" width="290" height="260" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Structural Authority</text>
  <text x="175" y="94" text-anchor="middle" font-size="11" fill="#475569">Who delegates to whom</text>

  <rect x="50" y="112" width="250" height="28" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="175" y="130" text-anchor="middle" font-size="11" fill="#1e40af">TopologyType + StructuralRole</text>

  <text x="175" y="162" text-anchor="middle" font-size="20" fill="#64748b">↓</text>

  <rect x="50" y="174" width="250" height="28" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="175" y="192" text-anchor="middle" font-size="11" fill="#1e40af">deriveAuthority()</text>

  <text x="175" y="222" text-anchor="middle" font-size="20" fill="#64748b">↓</text>

  <rect x="50" y="234" width="250" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">LOCAL | COORDINATED | CENTRAL</text>

  <text x="175" y="288" text-anchor="middle" font-size="10" fill="#94a3b8">Invalid combos throw IAE at construction</text>

  <!-- Operational Freedom (right) -->
  <rect x="360" y="50" width="290" height="260" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="505" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Operational Freedom</text>
  <text x="505" y="94" text-anchor="middle" font-size="11" fill="#475569">What categories of action are permitted</text>

  <rect x="380" y="112" width="250" height="28" rx="4" fill="#fff" stroke="#d97706" stroke-width="1"/>
  <text x="505" y="130" text-anchor="middle" font-size="11" fill="#78350f">DecisionScope + DecisionType</text>

  <text x="505" y="162" text-anchor="middle" font-size="20" fill="#64748b">↓</text>

  <rect x="380" y="174" width="250" height="28" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="505" y="192" text-anchor="middle" font-size="11" fill="#78350f">isPermitted()</text>

  <text x="505" y="222" text-anchor="middle" font-size="20" fill="#64748b">↓</text>

  <rect x="380" y="234" width="250" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="505" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">PERMIT | DENY</text>

  <text x="505" y="288" text-anchor="middle" font-size="10" fill="#94a3b8">Total function: every cell defined</text>

  <!-- Footer -->
  <text x="340" y="340" text-anchor="middle" font-size="11" fill="#64748b">Both dimensions are orthogonal by design — a CONTRACTOR can have FULL_AUTONOMY</text>
</svg>
