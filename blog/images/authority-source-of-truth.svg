<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Left: Wrong approach -->
  <text x="180" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">TWO SOURCES — CONSISTENCY HAZARD</text>

  <rect x="30" y="40" width="300" height="260" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>

  <!-- SPI box -->
  <rect x="55" y="60" width="250" height="50" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="180" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">SwarmTopologyProvider</text>
  <text x="180" y="95" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">describeTopology() + authorityFor()</text>

  <!-- Descriptor box -->
  <rect x="55" y="140" width="250" height="50" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="180" y="158" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">TopologyDescriptor</text>
  <text x="180" y="175" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">CENTRALISED + roles</text>

  <!-- Hazard -->
  <text x="180" y="220" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">⚠ Can disagree</text>
  <text x="180" y="236" text-anchor="middle" font-size="10" fill="#dc2626">descriptor says CENTRALISED</text>
  <text x="180" y="252" text-anchor="middle" font-size="10" fill="#dc2626">authorityFor() returns LOCAL</text>

  <line x1="180" y1="110" x2="180" y2="138" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)" stroke-dasharray="4,3"/>

  <!-- Right: Correct approach -->
  <text x="540" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">SINGLE SOURCE OF TRUTH</text>

  <rect x="390" y="40" width="300" height="260" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>

  <!-- SPI box -->
  <rect x="415" y="60" width="250" height="45" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="540" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">SwarmTopologyProvider</text>
  <text x="540" y="93" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">describeTopology() only</text>

  <!-- Descriptor box -->
  <rect x="415" y="135" width="250" height="70" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="540" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">TopologyDescriptor</text>
  <text x="540" y="172" text-anchor="middle" font-size="10" fill="#64748b">topologyType + agentRoles</text>
  <text x="540" y="192" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="500">authorityFor() — derived from own data</text>

  <!-- Derivation arrow -->
  <line x1="540" y1="105" x2="540" y2="133" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Consumer -->
  <rect x="415" y="235" width="250" height="45" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="540" y="255" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Consumer</text>
  <text x="540" y="270" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">calls descriptor.authorityFor(agentId)</text>

  <line x1="540" y1="205" x2="540" y2="233" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Guarantee label -->
  <text x="540" y="310" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="500">Authority always consistent with topology</text>
</svg>
