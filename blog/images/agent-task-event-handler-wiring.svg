<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">AgentTaskTarget dispatch — before and after</text>

  <!-- BEFORE row -->
  <text x="20" y="72" font-size="11" font-weight="600" fill="#dc2626">BEFORE</text>

  <rect x="80" y="55" width="130" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="145" y="77" text-anchor="middle" font-size="10" fill="#991b1b">ContextChanged</text>

  <line x1="210" y1="73" x2="248" y2="73" stroke="#dc2626" marker-end="url(#arrow-red)"/>

  <rect x="250" y="55" width="140" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="320" y="77" text-anchor="middle" font-size="10" fill="#991b1b">publishByTarget()</text>

  <line x1="390" y1="73" x2="428" y2="73" stroke="#dc2626" marker-end="url(#arrow-red)"/>

  <rect x="430" y="55" width="120" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="4,3"/>
  <text x="490" y="72" text-anchor="middle" font-size="10" fill="#991b1b">LOG.warnf(</text>
  <text x="490" y="84" text-anchor="middle" font-size="9" fill="#991b1b">"...handled via...")</text>

  <text x="590" y="77" font-size="20" fill="#dc2626">✗</text>
  <text x="615" y="77" font-size="10" fill="#991b1b">dead end</text>

  <!-- Divider -->
  <line x1="20" y1="115" x2="700" y2="115" stroke="#e2e8f0" stroke-dasharray="3,3"/>

  <!-- AFTER row -->
  <text x="20" y="155" font-size="11" font-weight="600" fill="#16a34a">AFTER</text>

  <rect x="80" y="138" width="130" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="145" y="160" text-anchor="middle" font-size="10" fill="#166534">ContextChanged</text>

  <line x1="210" y1="156" x2="248" y2="156" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <rect x="250" y="138" width="140" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="320" y="155" text-anchor="middle" font-size="10" fill="#166534">publishByTarget()</text>
  <text x="320" y="167" text-anchor="middle" font-size="9" fill="#166534">AgentTaskTarget</text>

  <line x1="390" y1="156" x2="428" y2="156" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <rect x="430" y="130" width="130" height="52" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="495" y="150" text-anchor="middle" font-size="10" fill="#166534">SyntheticAgent</text>
  <text x="495" y="162" text-anchor="middle" font-size="10" fill="#166534">TaskWorker</text>
  <text x="495" y="174" text-anchor="middle" font-size="9" fill="#166534">.create()</text>

  <line x1="560" y1="156" x2="588" y2="156" stroke="#16a34a" marker-end="url(#arrow-green)"/>

  <rect x="590" y="138" width="110" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="645" y="160" text-anchor="middle" font-size="10" fill="#166534">scheduleWorker</text>

  <!-- Execution pipeline row -->
  <line x1="645" y1="174" x2="645" y2="208" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="40" y="210" width="130" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="105" y="232" text-anchor="middle" font-size="10" fill="#334155">WorkerScheduleEvent</text>

  <line x1="170" y1="228" x2="208" y2="228" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="210" y="210" width="150" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="285" y="228" text-anchor="middle" font-size="10" fill="#334155">ExecutionOrchestrator</text>
  <text x="285" y="240" text-anchor="middle" font-size="9" fill="#64748b">worker lookup by name</text>

  <line x1="360" y1="228" x2="398" y2="228" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="400" y="210" width="150" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="475" y="228" text-anchor="middle" font-size="10" fill="#334155">AgentWorkerFunction</text>
  <text x="475" y="240" text-anchor="middle" font-size="9" fill="#64748b">Handler</text>

  <line x1="550" y1="228" x2="588" y2="228" stroke="#475569" marker-end="url(#arrow)"/>

  <rect x="590" y="210" width="110" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="645" y="228" text-anchor="middle" font-size="10" fill="#1e40af">AgentRegistry</text>
  <text x="645" y="240" text-anchor="middle" font-size="9" fill="#3b82f6">capability match</text>

  <!-- Connect schedule to pipeline -->
  <line x1="645" y1="210" x2="105" y2="210" stroke="#475569" stroke-dasharray="4,3"/>
  <line x1="105" y1="210" x2="105" y2="210" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Bottom: three gotchas -->
  <text x="20" y="285" font-size="11" font-weight="600" fill="#b45309">THREE SILENT FAILURES</text>

  <rect x="80" y="295" width="180" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="170" y="314" text-anchor="middle" font-size="9" fill="#92400e">① Capability missing from definition</text>

  <rect x="275" y="295" width="180" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="365" y="314" text-anchor="middle" font-size="9" fill="#92400e">② TenancyId mismatch (UUID, not "default")</text>

  <rect x="470" y="295" width="180" height="30" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="560" y="314" text-anchor="middle" font-size="9" fill="#92400e">③ Thread-unsafe ArrayList.add()</text>
</svg>
