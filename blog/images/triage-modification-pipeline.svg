<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-weight="700" fill="#1e293b" font-size="14">How modifications flow from triage to execution</text>

  <!-- BindingRecoveryState -->
  <rect x="40" y="50" width="200" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="72" text-anchor="middle" font-weight="600" fill="#1e40af">BindingRecoveryState</text>
  <text x="140" y="90" text-anchor="middle" fill="#3b82f6" font-size="11">stores raw Map&lt;String,Object&gt;</text>
  <text x="140" y="106" text-anchor="middle" fill="#3b82f6" font-size="11">per triage round</text>

  <!-- TriageModificationProvider -->
  <rect x="300" y="50" width="200" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="72" text-anchor="middle" font-weight="600" fill="#334155">TriageModProvider</text>
  <text x="400" y="90" text-anchor="middle" fill="#64748b" font-size="11">SPI in common-core</text>
  <text x="400" y="106" text-anchor="middle" fill="#64748b" font-size="11">bridges module boundary</text>

  <!-- Parser.mergeAll -->
  <rect x="300" y="155" width="200" height="70" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="400" y="177" text-anchor="middle" font-weight="600" fill="#854d0e">Parser.mergeAll()</text>
  <text x="400" y="195" text-anchor="middle" fill="#a16207" font-size="11">cumulative merge</text>
  <text x="400" y="211" text-anchor="middle" fill="#a16207" font-size="11">→ List&lt;PlaybookTriageMod&gt;</text>

  <!-- Applicator -->
  <rect x="300" y="260" width="200" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="282" text-anchor="middle" font-weight="600" fill="#166534">Applicator</text>
  <text x="400" y="300" text-anchor="middle" fill="#16a34a" font-size="11">transforms Workflow copy</text>
  <text x="400" y="316" text-anchor="middle" fill="#16a34a" font-size="11">+ parameter overrides</text>

  <!-- Handler -->
  <rect x="560" y="155" width="140" height="70" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="630" y="177" text-anchor="middle" font-weight="600" fill="#6d28d9">Handler</text>
  <text x="630" y="195" text-anchor="middle" fill="#7c3aed" font-size="11">FlowWorkerFn</text>
  <text x="630" y="211" text-anchor="middle" fill="#7c3aed" font-size="11">Handler</text>

  <!-- Modification types -->
  <rect x="40" y="155" width="200" height="90" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="140" y="175" text-anchor="middle" font-weight="600" fill="#c2410c" font-size="11">Modification types</text>
  <text x="60" y="196" fill="#9a3412" font-size="11">SkipStep → no-op replacement</text>
  <text x="60" y="214" fill="#9a3412" font-size="11">ReplaceStepInput → input swap</text>
  <text x="60" y="232" fill="#9a3412" font-size="11">UpdateParameter → input merge</text>

  <!-- SWF Instance -->
  <rect x="560" y="260" width="140" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="630" y="282" text-anchor="middle" font-weight="600" fill="#334155">WorkflowInstance</text>
  <text x="630" y="300" text-anchor="middle" fill="#64748b" font-size="11">modified workflow</text>
  <text x="630" y="316" text-anchor="middle" fill="#64748b" font-size="11">+ merged input</text>

  <!-- Arrows -->
  <line x1="240" y1="85" x2="292" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="400" y1="120" x2="400" y2="147" stroke="#475569" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="400" y1="225" x2="400" y2="252" stroke="#475569" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="500" y1="190" x2="552" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="630" y1="225" x2="630" y2="252" stroke="#475569" stroke-width="1.5" marker-end="url(#ap)"/>

  <!-- Module labels -->
  <text x="140" y="385" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">common-core</text>
  <text x="400" y="360" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">engine-support-core</text>
  <text x="630" y="360" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">SWF runtime</text>
  <text x="140" y="370" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">+ runtime-core</text>
</svg>
