<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="decay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <rect width="720" height="280" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Signal Lifecycle — Pheromone Decay</text>

  <!-- Axes -->
  <line x1="80" y1="220" x2="680" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="220" x2="80" y2="50" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="255" text-anchor="middle" font-size="10" fill="#64748b">Time</text>
  <text x="40" y="135" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90,40,135)">Strength</text>

  <!-- Decay curve: ρ(t) = s·e^(-λt) -->
  <path d="M 120 70 C 160 70, 180 80, 220 100 C 260 120, 300 150, 360 170 C 420 190, 480 200, 540 208 C 580 212, 620 215, 650 217" fill="none" stroke="url(#decay)" stroke-width="2.5"/>

  <!-- Effective zero threshold -->
  <line x1="80" y1="210" x2="680" y2="210" stroke="#ef4444" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="685" y="213" font-size="8" fill="#ef4444">effective zero</text>

  <!-- Deposit event -->
  <circle cx="120" cy="70" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="58" text-anchor="middle" font-size="9" font-weight="500" fill="#92400e">deposit</text>

  <!-- Reinforcement event -->
  <circle cx="220" cy="90" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <line x1="220" y1="100" x2="220" y2="90" stroke="#059669" stroke-width="2"/>
  <text x="220" y="82" text-anchor="middle" font-size="9" font-weight="500" fill="#059669">reinforce</text>
  <!-- bump path showing the reinforcement boost -->
  <path d="M 220 100 C 225 92, 230 90, 240 95" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Consensus zone -->
  <rect x="180" y="44" width="120" height="18" rx="3" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
  <text x="240" y="56" text-anchor="middle" font-size="8" fill="#065f46">consensus detected (3+ agents)</text>

  <!-- Expire event -->
  <circle cx="620" cy="216" r="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="620" y="238" text-anchor="middle" font-size="9" font-weight="500" fill="#dc2626">expire</text>

  <!-- Formula -->
  <rect x="400" y="100" width="200" height="40" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="117" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ρ(t) = s · e^(−λt)</text>
  <text x="500" y="133" text-anchor="middle" font-size="9" fill="#64748b">λ = ln(2) / halfLife</text>

  <!-- Annotation: stale info fades -->
  <text x="500" y="168" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">stale information fades — the system forgets what's no longer true</text>
</svg>
