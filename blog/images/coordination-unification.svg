<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Before: Two Separate Mechanisms</text>

  <!-- Left: Centralised coordinator (before) -->
  <rect x="30" y="50" width="280" height="110" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="170" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">LlmSwarmCoordinator</text>
  <text x="170" y="88" text-anchor="middle" font-size="10" fill="#dc2626">centralised — owns routing + aggregation</text>
  <text x="45" y="110" font-size="10" fill="#64748b">• SwarmRoutingStrategy (LLM call)</text>
  <text x="45" y="125" font-size="10" fill="#64748b">• CollectiveReasoningAggregation (LLM call)</text>
  <text x="45" y="140" font-size="10" fill="#64748b">• SwarmInvocationTracker (global budget)</text>
  <text x="45" y="155" font-size="10" fill="#64748b">• SwarmContext (shared mutable state)</text>

  <!-- Right: Per-agent (before) — missing -->
  <rect x="400" y="50" width="280" height="110" rx="8" fill="#f5f5f4" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="540" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#78716c">Per-Agent Loop</text>
  <text x="540" y="88" text-anchor="middle" font-size="10" fill="#a8a29e">didn't exist</text>
  <text x="415" y="110" font-size="10" fill="#a8a29e">• No local reasoning primitive</text>
  <text x="415" y="125" font-size="10" fill="#a8a29e">• No per-agent budget</text>
  <text x="415" y="140" font-size="10" fill="#a8a29e">• No scope enforcement</text>
  <text x="415" y="155" font-size="10" fill="#a8a29e">• Can't exist without coordinator</text>

  <!-- Divider -->
  <line x1="30" y1="190" x2="690" y2="190" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">After: One Primitive, Many Playbooks</text>

  <!-- Unified loop -->
  <rect x="160" y="230" width="400" height="75" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="360" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">AgentDecisionLoop</text>
  <text x="360" y="275" text-anchor="middle" font-size="10" fill="#4ade80">observe → reason → decide</text>
  <text x="360" y="292" text-anchor="middle" font-size="10" fill="#64748b">parameterised by: scope · observation · communication · budget · prompt sections</text>

  <!-- Arrows to three playbooks below -->
  <line x1="250" y1="305" x2="130" y2="305" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="90" y="310" text-anchor="middle" font-size="9" fill="#475569">centralised</text>

  <text x="360" y="315" text-anchor="middle" font-size="9" fill="#475569">distributed</text>

  <line x1="470" y1="305" x2="590" y2="305" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="630" y="310" text-anchor="middle" font-size="9" fill="#475569">hybrid</text>
</svg>
