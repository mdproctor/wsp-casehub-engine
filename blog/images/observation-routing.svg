<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arw" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#555"/>
    </marker>
  </defs>

  <text x="410" y="22" font-size="14" font-weight="600" text-anchor="middle" fill="#333">Observation Routing — Events to Decision Loops</text>

  <!-- SwarmCoordinationEvent column -->
  <rect x="20" y="50" width="200" height="260" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
  <text x="120" y="72" text-anchor="middle" font-weight="600" fill="#4a148c">SwarmCoordinationEvent</text>
  <line x1="40" y1="82" x2="200" y2="82" stroke="#6a1b9a" stroke-width="0.5"/>

  <rect x="36" y="92" width="168" height="26" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="0.6"/>
  <text x="120" y="109" text-anchor="middle" font-size="11" fill="#4a148c">SwarmInitialised</text>

  <rect x="36" y="126" width="168" height="26" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="0.6"/>
  <text x="120" y="143" text-anchor="middle" font-size="11" fill="#4a148c">RoleChanged</text>

  <rect x="36" y="160" width="168" height="26" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="0.6"/>
  <text x="120" y="177" text-anchor="middle" font-size="11" fill="#4a148c">TeamChanged</text>

  <rect x="36" y="194" width="168" height="26" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="0.6"/>
  <text x="120" y="211" text-anchor="middle" font-size="11" fill="#4a148c">MemberCompleted</text>

  <rect x="36" y="228" width="168" height="26" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="0.6"/>
  <text x="120" y="245" text-anchor="middle" font-size="11" fill="#4a148c">ProvisioningChanged</text>

  <rect x="36" y="262" width="168" height="26" rx="4" fill="#ce93d8" stroke="#6a1b9a" stroke-width="0.6"/>
  <text x="120" y="279" text-anchor="middle" font-size="11" font-weight="500" fill="#4a148c">ProgressUpdated</text>

  <!-- onSwarmEvent funnel -->
  <rect x="260" y="140" width="110" height="60" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.2"/>
  <text x="315" y="166" text-anchor="middle" font-size="11" font-weight="500" fill="#e65100">onSwarmEvent</text>
  <text x="315" y="182" text-anchor="middle" font-size="10" fill="#777">+ feedLoop()</text>

  <!-- Arrows from events to funnel -->
  <line x1="204" y1="105" x2="260" y2="155" stroke="#6a1b9a" stroke-width="0.8" marker-end="url(#arw)"/>
  <line x1="204" y1="139" x2="260" y2="158" stroke="#6a1b9a" stroke-width="0.8" marker-end="url(#arw)"/>
  <line x1="204" y1="173" x2="260" y2="165" stroke="#6a1b9a" stroke-width="0.8" marker-end="url(#arw)"/>
  <line x1="204" y1="207" x2="260" y2="172" stroke="#6a1b9a" stroke-width="0.8" marker-end="url(#arw)"/>
  <line x1="204" y1="241" x2="260" y2="180" stroke="#6a1b9a" stroke-width="0.8" marker-end="url(#arw)"/>
  <line x1="204" y1="275" x2="260" y2="185" stroke="#ce93d8" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arw)"/>

  <!-- Decision loops column -->
  <rect x="430" y="50" width="370" height="260" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="615" y="72" text-anchor="middle" font-weight="600" fill="#0d47a1">AgentDecisionLoops</text>
  <line x1="450" y1="82" x2="780" y2="82" stroke="#1565c0" stroke-width="0.5"/>

  <!-- Team Formation loop -->
  <rect x="450" y="92" width="330" height="48" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="615" y="112" text-anchor="middle" font-weight="500" fill="#0d47a1">Team Formation</text>
  <text x="615" y="128" text-anchor="middle" font-size="10" fill="#555">candidates-available, roles-changed</text>

  <!-- Collective Reasoning loop -->
  <rect x="450" y="152" width="330" height="48" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="615" y="172" text-anchor="middle" font-weight="500" fill="#0d47a1">Collective Reasoning</text>
  <text x="615" y="188" text-anchor="middle" font-size="10" fill="#555">team-changed, member-completed</text>

  <!-- Provisioning loop -->
  <rect x="450" y="212" width="330" height="48" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="0.8"/>
  <text x="615" y="232" text-anchor="middle" font-weight="500" fill="#0d47a1">Provisioning</text>
  <text x="615" y="248" text-anchor="middle" font-size="10" fill="#555">provisioning-changed</text>

  <!-- Broadcast zone -->
  <rect x="450" y="270" width="330" height="28" rx="4" fill="#e1f5fe" stroke="#1565c0" stroke-width="0.5"/>
  <text x="615" y="289" text-anchor="middle" font-size="10" fill="#555">progress-updated → all loops (broadcast)</text>

  <!-- Arrows from funnel to loops -->
  <line x1="370" y1="152" x2="450" y2="116" stroke="#1565c0" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="370" y1="165" x2="450" y2="176" stroke="#1565c0" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="370" y1="182" x2="450" y2="236" stroke="#1565c0" stroke-width="1" marker-end="url(#arw)"/>
  <line x1="370" y1="190" x2="450" y2="284" stroke="#ce93d8" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arw)"/>

  <!-- Annotation -->
  <text x="410" y="330" text-anchor="middle" font-size="11" fill="#888">Each loop observes what it needs. ProgressUpdated is situational awareness for all.</text>
</svg>
