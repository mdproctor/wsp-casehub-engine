<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    </marker>
    <marker id="arr2-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <marker id="arr2-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Worker executes -->
  <rect x="40" y="60" width="140" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="82" text-anchor="middle" font-weight="600" fill="#334155">Worker</text>
  <text x="110" y="98" text-anchor="middle" fill="#64748b" font-size="11">executes playbook</text>

  <!-- Failure -->
  <rect x="240" y="60" width="120" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="82" text-anchor="middle" font-weight="600" fill="#991b1b">Failure</text>
  <text x="300" y="98" text-anchor="middle" fill="#b91c1c" font-size="11">step-3 errors</text>

  <!-- Recovery -->
  <rect x="420" y="60" width="140" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="490" y="82" text-anchor="middle" font-weight="600" fill="#334155">Recovery</text>
  <text x="490" y="98" text-anchor="middle" fill="#64748b" font-size="11">coordinator</text>

  <!-- Triage -->
  <rect x="420" y="170" width="140" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="490" y="192" text-anchor="middle" font-weight="600" fill="#1e40af">Triage</text>
  <text x="490" y="208" text-anchor="middle" fill="#3b82f6" font-size="11">decides: skip step-3</text>

  <!-- Apply modifications -->
  <rect x="220" y="170" width="160" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="192" text-anchor="middle" font-weight="600" fill="#166534">Apply mods</text>
  <text x="300" y="208" text-anchor="middle" fill="#16a34a" font-size="11">step-3 → no-op</text>

  <!-- Success -->
  <rect x="40" y="170" width="140" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="110" y="192" text-anchor="middle" font-weight="600" fill="#166534">Success</text>
  <text x="110" y="208" text-anchor="middle" fill="#16a34a" font-size="11">modified playbook runs</text>

  <!-- Closed loop label -->
  <rect x="220" y="255" width="280" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="360" y="278" text-anchor="middle" font-weight="600" fill="#166534" font-size="12">Closed loop: triage decisions take effect</text>

  <!-- Arrows -->
  <line x1="180" y1="85" x2="232" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2-b)"/>
  <line x1="360" y1="85" x2="412" y2="85" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr2-r)"/>
  <line x1="490" y1="110" x2="490" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2-b)"/>
  <line x1="420" y1="195" x2="388" y2="195" stroke="#475569" stroke-width="1.5" marker-end="url(#arr2-b)"/>
  <line x1="220" y1="195" x2="188" y2="195" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>
