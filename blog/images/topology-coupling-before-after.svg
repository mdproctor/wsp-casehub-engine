<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="ar" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="20" y="24" font-weight="600" fill="#1e293b" font-size="14">Before: CentralisedTopology coupled to concrete swarm types</text>

  <!-- CentralisedTopology box -->
  <rect x="220" y="45" width="200" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-weight="600" fill="#991b1b" font-size="12">CentralisedTopology</text>
  <text x="320" y="83" text-anchor="middle" fill="#991b1b" font-size="10">constructor takes concrete types</text>

  <!-- Concrete dependencies -->
  <rect x="30" y="130" width="130" height="35" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="95" y="152" text-anchor="middle" fill="#991b1b" font-size="10">SwarmRoutingStrategy</text>

  <rect x="180" y="130" width="155" height="35" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="257" y="152" text-anchor="middle" fill="#991b1b" font-size="10">CollectiveReasoningAggr.</text>

  <rect x="355" y="130" width="110" height="35" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="410" y="152" text-anchor="middle" fill="#991b1b" font-size="10">SwarmContext</text>

  <rect x="485" y="130" width="130" height="35" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="550" y="152" text-anchor="middle" fill="#991b1b" font-size="10">SwarmFallbackStrategy</text>

  <!-- Red arrows -->
  <line x1="270" y1="95" x2="95" y2="126" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ar-red)"/>
  <line x1="300" y1="95" x2="257" y2="126" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ar-red)"/>
  <line x1="340" y1="95" x2="410" y2="126" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ar-red)"/>
  <line x1="370" y1="95" x2="550" y2="126" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ar-red)"/>

  <text x="640" y="95" fill="#dc2626" font-size="10" font-weight="500">only usable</text>
  <text x="640" y="108" fill="#dc2626" font-size="10" font-weight="500">with swarms</text>

  <!-- AFTER -->
  <line x1="20" y1="195" x2="720" y2="195" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="224" font-weight="600" fill="#1e293b" font-size="14">After: CentralisedTopology&lt;C&gt; uses generic interfaces</text>

  <!-- CentralisedTopology<C> box -->
  <rect x="220" y="245" width="200" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="320" y="268" text-anchor="middle" font-weight="600" fill="#166534" font-size="12">CentralisedTopology&lt;C&gt;</text>
  <text x="320" y="283" text-anchor="middle" fill="#166534" font-size="10">accepts generic interfaces</text>

  <!-- Generic interfaces -->
  <rect x="50" y="330" width="120" height="35" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="352" text-anchor="middle" fill="#1e40af" font-size="10">RoutingStrategy&lt;C&gt;</text>

  <rect x="190" y="330" width="140" height="35" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="260" y="352" text-anchor="middle" fill="#1e40af" font-size="10">AggregationStrategy&lt;C&gt;</text>

  <rect x="350" y="330" width="140" height="35" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="420" y="352" text-anchor="middle" fill="#1e40af" font-size="10">TerminationCondition&lt;C&gt;</text>

  <!-- Green arrows -->
  <line x1="270" y1="295" x2="110" y2="326" stroke="#475569" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="310" y1="295" x2="260" y2="326" stroke="#475569" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="350" y1="295" x2="420" y2="326" stroke="#475569" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- Implementations -->
  <text x="50" y="385" fill="#64748b" font-size="10">SwarmRouting</text>
  <text x="110" y="385" fill="#64748b" font-size="10">FirstMatch</text>
  <text x="190" y="385" fill="#64748b" font-size="10">CollectiveReasoning</text>
  <text x="310" y="385" fill="#64748b" font-size="10">CollectAll</text>
  <text x="370" y="385" fill="#64748b" font-size="10">Convergence</text>
  <text x="460" y="385" fill="#64748b" font-size="10">MaxIterations</text>

  <text x="50" y="400" fill="#94a3b8" font-size="9">↑ existing implementations — already in the codebase</text>

  <!-- Label -->
  <rect x="540" y="255" width="170" height="50" rx="4" fill="#fefce8" stroke="#fbbf24" stroke-width="1"/>
  <text x="625" y="275" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="500">supervisor, hub-spoke,</text>
  <text x="625" y="290" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="500">pipeline coordinator...</text>
  <line x1="420" y1="270" x2="536" y2="270" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar)"/>
</svg>
