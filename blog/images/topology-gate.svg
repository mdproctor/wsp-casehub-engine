<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">SWARMPROVISIONER TOPOLOGY GATE</text>

  <!-- Trigger -->
  <rect x="200" y="40" width="200" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="63" text-anchor="middle" font-size="11" fill="#475569">Provisioning signal detected</text>

  <line x1="300" y1="76" x2="300" y2="100" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Gate diamond -->
  <polygon points="300,102 390,142 300,182 210,142" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="300" y="138" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">topology</text>
  <text x="300" y="152" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">type?</text>

  <!-- CENTRALISED / HYBRID path -->
  <line x1="300" y1="182" x2="300" y2="220" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="318" y="200" font-size="10" fill="#16a34a" font-weight="500">CENTRALISED</text>
  <text x="318" y="212" font-size="10" fill="#16a34a" font-weight="500">HYBRID</text>

  <rect x="190" y="222" width="220" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="300" y="240" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">Proceed with provisioning</text>
  <text x="300" y="254" text-anchor="middle" font-size="9" fill="#64748b">budget checks, advisor, dispatch</text>

  <!-- DISTRIBUTED path -->
  <line x1="390" y1="142" x2="480" y2="142" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="430" y="134" font-size="10" fill="#dc2626" font-weight="500">DISTRIBUTED</text>

  <rect x="482" y="122" width="100" height="40" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="532" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Skip</text>
  <text x="532" y="154" text-anchor="middle" font-size="9" fill="#64748b">not my job</text>
</svg>
