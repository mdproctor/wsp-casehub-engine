<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Before side -->
  <text x="180" y="22" text-anchor="middle" font-weight="600" font-size="15" fill="#333">Before: two independent pools</text>

  <!-- Pool A -->
  <rect x="20" y="40" width="150" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="95" y="60" text-anchor="middle" font-weight="600" fill="#991b1b" font-size="12">Pool A</text>
  <text x="95" y="76" text-anchor="middle" fill="#991b1b" font-size="10">builder-created</text>

  <!-- Pool B -->
  <rect x="200" y="40" width="150" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="275" y="60" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">Pool B</text>
  <text x="275" y="76" text-anchor="middle" fill="#1e40af" font-size="10">topology-created</text>

  <!-- Consumers -->
  <rect x="20" y="120" width="150" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="95" y="144" text-anchor="middle" fill="#92400e" font-size="11">Routing / Aggregation</text>

  <!-- Decision loops -->
  <rect x="200" y="120" width="150" height="40" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="275" y="144" text-anchor="middle" fill="#3730a3" font-size="11">Decision Loops</text>

  <!-- Arrows -->
  <line x1="95" y1="90" x2="95" y2="118" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="110" y="108" fill="#991b1b" font-size="9">gate + tokens</text>
  <line x1="275" y1="90" x2="275" y2="118" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="290" y="108" fill="#1e40af" font-size="9">gate only (0 tokens)</text>

  <!-- LLM call -->
  <rect x="110" y="185" width="140" height="30" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="180" y="204" text-anchor="middle" fill="#374151" font-size="11">LLM call</text>

  <line x1="95" y1="160" x2="150" y2="183" stroke="#d97706" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="275" y1="160" x2="220" y2="183" stroke="#4f46e5" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Problem annotation -->
  <text x="180" y="240" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">double-gated, split accounting</text>

  <!-- Divider -->
  <line x1="370" y1="30" x2="370" y2="260" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- After side -->
  <text x="545" y="22" text-anchor="middle" font-weight="600" font-size="15" fill="#333">After: single pool</text>

  <!-- Single pool -->
  <rect x="470" y="40" width="150" height="50" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="545" y="60" text-anchor="middle" font-weight="600" fill="#065f46" font-size="12">Pool</text>
  <text x="545" y="76" text-anchor="middle" fill="#065f46" font-size="10">topology-created</text>

  <!-- Decision loops (after) -->
  <rect x="410" y="120" width="120" height="40" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="470" y="144" text-anchor="middle" fill="#3730a3" font-size="11">Decision Loops</text>

  <!-- Consumers (after) -->
  <rect x="560" y="120" width="120" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="620" y="144" text-anchor="middle" fill="#92400e" font-size="11">Consumers</text>

  <!-- Arrows (after) -->
  <line x1="510" y1="90" x2="470" y2="118" stroke="#059669" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="445" y="108" fill="#065f46" font-size="9">gate (calls)</text>
  <line x1="580" y1="90" x2="620" y2="118" stroke="#059669" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="640" y="108" fill="#065f46" font-size="9">record (tokens)</text>

  <!-- LLM call (after) -->
  <rect x="475" y="185" width="140" height="30" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="545" y="204" text-anchor="middle" fill="#374151" font-size="11">LLM call</text>

  <line x1="470" y1="160" x2="515" y2="183" stroke="#4f46e5" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="620" y1="160" x2="575" y2="183" stroke="#d97706" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Solution annotation -->
  <text x="545" y="240" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">single gate, unified accounting</text>
</svg>
