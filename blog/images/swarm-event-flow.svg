<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="flow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="flow-emit" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="400" rx="8" fill="#fafafa" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Swarm Coordination Event Flow</text>

  <!-- Phase labels -->
  <text x="170" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">DETECTION</text>
  <text x="430" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">NOTIFICATION</text>
  <text x="670" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">CONSUMPTION</text>

  <!-- Vertical dividers -->
  <line x1="300" y1="45" x2="300" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="560" y1="45" x2="560" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Detection column -->
  <rect x="50" y="75" width="200" height="40" rx="5" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="#4338ca">RoleTracker.detect()</text>

  <rect x="50" y="135" width="200" height="40" rx="5" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="150" y="160" text-anchor="middle" font-size="12" fill="#4338ca">TeamDetector.detect()</text>

  <rect x="50" y="195" width="200" height="40" rx="5" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#4338ca">ProgressTracker.evaluate()</text>

  <rect x="50" y="270" width="200" height="40" rx="5" fill="#d1fae5" stroke="#10b981"/>
  <text x="150" y="295" text-anchor="middle" font-size="12" fill="#065f46">SwarmProvisioner</text>

  <rect x="50" y="330" width="200" height="40" rx="5" fill="#d1fae5" stroke="#10b981"/>
  <text x="150" y="355" text-anchor="middle" font-size="12" fill="#065f46">evaluateDeprovisioning()</text>

  <!-- Notification column — SwarmProvisioner as hub -->
  <rect x="320" y="75" width="220" height="40" rx="5" fill="#d1fae5" stroke="#10b981"/>
  <text x="430" y="100" text-anchor="middle" font-size="11" fill="#065f46">notifyRolesChanged()</text>

  <rect x="320" y="135" width="220" height="40" rx="5" fill="#d1fae5" stroke="#10b981"/>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#065f46">notifyTeamsChanged()</text>

  <rect x="320" y="195" width="220" height="40" rx="5" fill="#d1fae5" stroke="#10b981"/>
  <text x="430" y="220" text-anchor="middle" font-size="11" fill="#065f46">notifyProgressUpdated()</text>

  <rect x="320" y="270" width="220" height="40" rx="5" fill="#d1fae5" stroke="#10b981"/>
  <text x="430" y="295" text-anchor="middle" font-size="11" fill="#065f46">onProvisioningChanged()</text>

  <rect x="320" y="330" width="220" height="40" rx="5" fill="#d1fae5" stroke="#10b981"/>
  <text x="430" y="355" text-anchor="middle" font-size="11" fill="#065f46">onProvisioningChanged()</text>

  <!-- Consumption column -->
  <rect x="580" y="170" width="180" height="70" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="670" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">SwarmCoordination</text>
  <text x="670" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Listener(s)</text>
  <text x="670" y="230" text-anchor="middle" font-size="10" fill="#b45309" font-style="italic">agency bridge, metrics, logging...</text>

  <!-- Flow arrows: detection → notification -->
  <line x1="250" y1="95" x2="318" y2="95" stroke="#6366f1" stroke-width="1.5" marker-end="url(#flow)"/>
  <line x1="250" y1="155" x2="318" y2="155" stroke="#6366f1" stroke-width="1.5" marker-end="url(#flow)"/>
  <line x1="250" y1="215" x2="318" y2="215" stroke="#6366f1" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- Provisioner emits directly -->
  <text x="275" y="288" text-anchor="middle" font-size="9" fill="#059669">direct</text>
  <text x="275" y="348" text-anchor="middle" font-size="9" fill="#059669">direct</text>

  <!-- Flow arrows: notification → consumption -->
  <line x1="540" y1="95" x2="580" y2="190" stroke="#10b981" stroke-width="1.5" marker-end="url(#flow-emit)"/>
  <line x1="540" y1="155" x2="580" y2="200" stroke="#10b981" stroke-width="1.5" marker-end="url(#flow-emit)"/>
  <line x1="540" y1="215" x2="580" y2="210" stroke="#10b981" stroke-width="1.5" marker-end="url(#flow-emit)"/>
  <line x1="540" y1="290" x2="580" y2="220" stroke="#10b981" stroke-width="1.5" marker-end="url(#flow-emit)"/>
  <line x1="540" y1="350" x2="580" y2="230" stroke="#10b981" stroke-width="1.5" marker-end="url(#flow-emit)"/>
</svg>
