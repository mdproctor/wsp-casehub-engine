<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Event Decorator Framework — Runtime Wiring</text>

  <!-- EventContainer box -->
  <rect x="240" y="50" width="240" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="75" text-anchor="middle" font-weight="600" fill="#1e3a5f">EventContainer</text>
  <text x="360" y="93" text-anchor="middle" font-size="11" fill="#475569">register() → start() → stop()</text>

  <!-- @ApplicationScoped class -->
  <rect x="40" y="150" width="200" height="90" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="172" text-anchor="middle" font-weight="600" fill="#166534">@ApplicationScoped</text>
  <text x="140" y="192" text-anchor="middle" font-size="11" fill="#475569">HelpdeskReactions</text>
  <text x="140" y="210" text-anchor="middle" font-size="11" fill="#16a34a">@Observes('helpdesk:tickets')</text>
  <text x="140" y="226" text-anchor="middle" font-size="11" fill="#16a34a">@Observes('helpdesk:notifications')</text>

  <!-- EventStream (pages-data) -->
  <rect x="480" y="150" width="200" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="580" y="175" text-anchor="middle" font-weight="600" fill="#92400e">EventStream</text>
  <text x="580" y="195" text-anchor="middle" font-size="11" fill="#475569">@casehubio/pages-data</text>
  <text x="580" y="210" text-anchor="middle" font-size="11" fill="#475569">defaultPool (shared WS)</text>

  <!-- WebSocket -->
  <rect x="480" y="280" width="200" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="580" y="302" text-anchor="middle" font-weight="600" fill="#9d174d">WebSocket</text>
  <text x="580" y="318" text-anchor="middle" font-size="11" fill="#475569">ws://host/push</text>

  <!-- REST Publish -->
  <rect x="40" y="280" width="200" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140" y="302" text-anchor="middle" font-weight="600" fill="#5b21b6">REST Publish</text>
  <text x="140" y="318" text-anchor="middle" font-size="11" fill="#475569">POST /api/push/publish/{topic}</text>

  <!-- Server box -->
  <rect x="240" y="360" width="240" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="360" y="380" text-anchor="middle" font-size="11" fill="#475569">PushPublishResource → EventBroadcaster → EventStore</text>

  <!-- Arrows -->
  <!-- Container reads metadata from class -->
  <line x1="240" y1="80" x2="200" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="118" font-size="10" fill="#475569">reads metadata</text>

  <!-- Container creates EventStream -->
  <line x1="480" y1="80" x2="520" y2="150" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="510" y="118" font-size="10" fill="#2563eb">creates</text>

  <!-- EventStream connects to WebSocket -->
  <line x1="580" y1="220" x2="580" y2="275" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="252" font-size="10" fill="#d97706">subscribe</text>

  <!-- WebSocket delivers events back up -->
  <path d="M 480,290 L 400,195 L 240,195" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="380" y="240" font-size="10" fill="#16a34a">events routed to @Observes</text>

  <!-- @Publish goes to REST -->
  <line x1="140" y1="240" x2="140" y2="275" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="262" font-size="10" fill="#7c3aed">@Publish → fetch</text>

  <!-- REST to server -->
  <line x1="200" y1="315" x2="280" y2="360" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Server broadcasts back to WebSocket -->
  <line x1="440" y1="375" x2="520" y2="315" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
  <text x="470" y="352" font-size="10" fill="#94a3b8">broadcast</text>
</svg>
