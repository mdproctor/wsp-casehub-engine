<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#444"/>
    </marker>
  </defs>

  <text x="390" y="22" font-size="14" font-weight="600" text-anchor="middle" fill="#333">Decision Loop Pipeline — What You Get for Free</text>

  <!-- SwarmEvent -->
  <rect x="20" y="50" width="120" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="80" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="#1b5e20">Swarm</text>
  <text x="80" y="82" text-anchor="middle" font-size="11" font-weight="500" fill="#1b5e20">Event</text>

  <line x1="140" y1="72" x2="168" y2="72" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

  <!-- onSwarmEvent -->
  <rect x="170" y="46" width="100" height="52" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.2"/>
  <text x="220" y="66" text-anchor="middle" font-size="10" fill="#4a148c">onSwarmEvent</text>
  <text x="220" y="80" text-anchor="middle" font-size="10" fill="#4a148c">→ collect()</text>

  <line x1="270" y1="72" x2="298" y2="72" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Pipeline stages -->
  <rect x="300" y="40" width="100" height="64" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1"/>
  <text x="350" y="58" text-anchor="middle" font-size="10" font-weight="500" fill="#e65100">Reasoner</text>
  <text x="350" y="72" text-anchor="middle" font-size="9" fill="#777">(your strategy)</text>
  <text x="350" y="86" text-anchor="middle" font-size="9" fill="#777">LLM call here</text>

  <line x1="400" y1="72" x2="418" y2="72" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="420" y="40" width="100" height="64" rx="6" fill="#e8eaf6" stroke="#283593" stroke-width="1"/>
  <text x="470" y="58" text-anchor="middle" font-size="10" font-weight="500" fill="#1a237e">Section</text>
  <text x="470" y="72" text-anchor="middle" font-size="10" font-weight="500" fill="#1a237e">Aware</text>
  <text x="470" y="86" text-anchor="middle" font-size="9" fill="#777">prompt injection</text>

  <line x1="520" y1="72" x2="538" y2="72" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="540" y="40" width="100" height="64" rx="6" fill="#fce4ec" stroke="#b71c1c" stroke-width="1"/>
  <text x="590" y="58" text-anchor="middle" font-size="10" font-weight="500" fill="#b71c1c">Budget</text>
  <text x="590" y="72" text-anchor="middle" font-size="10" font-weight="500" fill="#b71c1c">Aware</text>
  <text x="590" y="86" text-anchor="middle" font-size="9" fill="#777">token guard</text>

  <line x1="640" y1="72" x2="658" y2="72" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Outcome -->
  <rect x="660" y="50" width="100" height="44" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="710" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="#0d47a1">Decision</text>
  <text x="710" y="82" text-anchor="middle" font-size="11" font-weight="500" fill="#0d47a1">Outcome</text>

  <!-- Free label -->
  <rect x="410" y="116" width="240" height="24" rx="12" fill="#c8e6c9" stroke="#2e7d32" stroke-width="0.8"/>
  <text x="530" y="132" text-anchor="middle" font-size="11" font-weight="500" fill="#1b5e20">← these three layers are free →</text>

  <!-- Annotations below -->
  <text x="350" y="166" text-anchor="middle" font-size="11" fill="#555">You write the Reasoner.</text>
  <text x="350" y="182" text-anchor="middle" font-size="11" fill="#555">The loop pipeline wraps it.</text>

  <!-- Type dispatch -->
  <line x1="710" y1="94" x2="710" y2="140" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="620" y="144" width="140" height="80" rx="6" fill="#f5f5f5" stroke="#616161" stroke-width="1"/>
  <text x="690" y="164" text-anchor="middle" font-size="10" font-weight="500" fill="#333">Executor dispatch</text>
  <line x1="640" y1="172" x2="740" y2="172" stroke="#bbb" stroke-width="0.5"/>
  <text x="690" y="188" text-anchor="middle" font-size="10" fill="#555">Route → assign</text>
  <text x="690" y="202" text-anchor="middle" font-size="10" fill="#555">Aggregate → store</text>
  <text x="690" y="216" text-anchor="middle" font-size="10" fill="#555">Provision → scale</text>

  <!-- Annotation -->
  <text x="390" y="256" text-anchor="middle" font-size="11" fill="#888">The sealed type IS the source discriminator — no loop identity needed</text>
</svg>
