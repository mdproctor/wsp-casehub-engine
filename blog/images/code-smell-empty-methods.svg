<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">

  <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#1e293b" font-size="14">The code smell: 5 of 6 topologies have empty onSwarmEvent()</text>

  <!-- Code blocks -->
  <rect x="20" y="40" width="310" height="100" rx="4" fill="#1e293b"/>
  <text x="30" y="60" fill="#94a3b8" font-size="11">// CentralisedTopology — the only one that uses it</text>
  <text x="30" y="78" fill="#c084fc" font-size="11">@Override</text>
  <text x="30" y="93" fill="#67e8f9" font-size="11">public void</text><text x="115" y="93" fill="#fbbf24" font-size="11"> onSwarmEvent</text><text x="225" y="93" fill="#e2e8f0" font-size="11">(...) {</text>
  <text x="40" y="108" fill="#86efac" font-size="11">swarmContext.onProgressUpdated(...);</text>
  <text x="30" y="123" fill="#e2e8f0" font-size="11">}</text>

  <rect x="20" y="155" width="310" height="100" rx="4" fill="#1e293b"/>
  <text x="30" y="175" fill="#94a3b8" font-size="11">// DistributedTopology</text>
  <text x="30" y="190" fill="#94a3b8" font-size="11">// HierarchicalTopology</text>
  <text x="30" y="205" fill="#94a3b8" font-size="11">// HiveTopology, HybridTopology, GraduatedTopology</text>
  <text x="30" y="223" fill="#c084fc" font-size="11">@Override</text>
  <text x="30" y="238" fill="#67e8f9" font-size="11">public void</text><text x="115" y="238" fill="#fbbf24" font-size="11"> onSwarmEvent</text><text x="225" y="238" fill="#e2e8f0" font-size="11">(...) {</text>
  <text x="30" y="253" fill="#e2e8f0" font-size="11">}</text>

  <!-- Annotation -->
  <rect x="370" y="155" width="310" height="100" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="525" y="185" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Interface Segregation Principle</text>
  <text x="525" y="210" text-anchor="middle" fill="#991b1b" font-size="11" font-family="system-ui, -apple-system, sans-serif">5 empty implementations = the interface</text>
  <text x="525" y="228" text-anchor="middle" fill="#991b1b" font-size="11" font-family="system-ui, -apple-system, sans-serif">is forcing a contract its implementors</text>
  <text x="525" y="246" text-anchor="middle" fill="#991b1b" font-size="11" font-family="system-ui, -apple-system, sans-serif">don't need</text>

  <text x="20" y="275" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, sans-serif">When most implementations of a method are empty, the method doesn't belong on the interface.</text>
</svg>
