<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafaf9" rx="6"/>

  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Factory bridge — event emission without coupling</text>

  <!-- Summariser chain (left) -->
  <rect x="30" y="50" width="240" height="230" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="150" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Summariser Chain</text>

  <rect x="55" y="86" width="190" height="28" rx="3" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <text x="150" y="105" text-anchor="middle" font-size="10" fill="#334155">DegradationAwareSummariser</text>

  <rect x="55" y="126" width="190" height="28" rx="3" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <text x="150" y="145" text-anchor="middle" font-size="10" fill="#334155">BudgetAwareSummariser</text>

  <rect x="55" y="166" width="190" height="28" rx="3" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <text x="150" y="185" text-anchor="middle" font-size="10" fill="#334155">SectionAwareSummariser</text>

  <rect x="55" y="206" width="190" height="28" rx="3" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <text x="150" y="225" text-anchor="middle" font-size="10" fill="#334155">LLM Reasoner</text>

  <!-- Existing events (bottom-left) -->
  <rect x="55" y="248" width="90" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="263" text-anchor="middle" font-size="9" fill="#92400e">BudgetTelemetry</text>

  <rect x="155" y="248" width="90" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="263" text-anchor="middle" font-size="9" fill="#92400e">SwarmDegraded</text>

  <!-- Factory bridge (center) -->
  <rect x="310" y="80" width="140" height="190" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="380" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Factory Bridge</text>

  <text x="380" y="125" text-anchor="middle" font-size="9" fill="#6d28d9">budgetBridge</text>
  <rect x="325" y="132" width="110" height="20" rx="3" fill="white" stroke="#a78bfa" stroke-width="1"/>
  <text x="380" y="146" text-anchor="middle" font-size="8" fill="#4c1d95">accept + switch</text>

  <text x="380" y="175" text-anchor="middle" font-size="9" fill="#6d28d9">degradationBridge</text>
  <rect x="325" y="182" width="110" height="20" rx="3" fill="white" stroke="#a78bfa" stroke-width="1"/>
  <text x="380" y="196" text-anchor="middle" font-size="8" fill="#4c1d95">accept + emit</text>

  <text x="380" y="230" text-anchor="middle" font-size="9" fill="#6d28d9">context</text>
  <text x="380" y="245" text-anchor="middle" font-size="8" fill="#7c3aed">caseId + agentId</text>
  <text x="380" y="258" text-anchor="middle" font-size="8" fill="#7c3aed">from DecisionContext</text>

  <!-- DecisionLoopEvent output (right) -->
  <rect x="500" y="100" width="190" height="150" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="595" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">DecisionLoopEvent</text>

  <text x="520" y="145" font-size="9" fill="#15803d">→ ReasoningStarted</text>
  <text x="520" y="163" font-size="9" fill="#15803d">→ ReasoningCompleted</text>
  <text x="520" y="181" font-size="9" fill="#15803d">→ BudgetExhausted</text>
  <text x="520" y="199" font-size="9" fill="#15803d">→ Degraded</text>
  <text x="520" y="217" font-size="9" fill="#15803d">→ LoopTriggered</text>
  <text x="520" y="235" font-size="9" fill="#15803d">→ ObservationGathered</text>

  <!-- Arrows -->
  <line x1="245" y1="140" x2="310" y2="140" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="245" y1="100" x2="310" y2="190" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="145" x2="500" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <line x1="450" y1="195" x2="500" y2="195" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrBlue)"/>

  <!-- Key insight label -->
  <text x="380" y="310" text-anchor="middle" font-size="10" fill="#64748b">Summarisers emit domain events (Budget/Degraded) → Bridge enriches with agent identity → DecisionLoopEvent</text>
  <text x="380" y="326" text-anchor="middle" font-size="10" fill="#64748b">No coupling: summarisers stay generic, bridge has the context</text>
</svg>
