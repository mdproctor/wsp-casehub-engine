<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Worker Dispatch Chain — Before and After</text>

  <!-- Phase labels -->
  <text x="20" y="62" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="1">PARSE TIME</text>
  <text x="20" y="232" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="1">DISPATCH TIME</text>

  <!-- Parse-time row -->
  <rect x="20" y="74" width="140" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="90" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">YAML worker</text>
  <text x="90" y="110" text-anchor="middle" font-size="11" fill="#64748b">do: / agent:</text>

  <line x1="160" y1="98" x2="200" y2="98" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="204" y="74" width="180" height="48" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="294" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#0c4a6e">WorkerFunctionProvider</text>
  <text x="294" y="110" text-anchor="middle" font-size="11" fill="#0369a1">handles() → create()</text>

  <line x1="384" y1="98" x2="424" y2="98" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="428" y="74" width="140" height="48" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="498" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#0c4a6e">WorkerFunction</text>
  <text x="498" y="110" text-anchor="middle" font-size="11" fill="#0369a1">Flow / Agent</text>

  <line x1="568" y1="98" x2="608" y2="98" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="612" y="74" width="96" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="660" y="94" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">Worker</text>
  <text x="660" y="110" text-anchor="middle" font-size="11" fill="#64748b">record</text>

  <!-- Gap annotation — BEFORE (red) -->
  <rect x="204" y="140" width="504" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="456" y="157" text-anchor="middle" font-size="11" fill="#dc2626">BEFORE: AgentWorkerFunctionProvider only matched slot: — capability: fell through to NONE</text>
  <text x="456" y="171" text-anchor="middle" font-size="11" fill="#dc2626">CaseDefinitionRegistry registered definitions but created no CaseHub</text>

  <!-- Dispatch-time row -->
  <rect x="20" y="244" width="120" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="264" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">Binding fires</text>
  <text x="80" y="280" text-anchor="middle" font-size="11" fill="#64748b">CapabilityTarget</text>

  <line x1="140" y1="268" x2="170" y2="268" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="174" y="244" width="150" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="249" y="264" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">CandidateFactory</text>
  <text x="249" y="280" text-anchor="middle" font-size="11" fill="#64748b">match by capability</text>

  <line x1="324" y1="268" x2="354" y2="268" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="358" y="244" width="160" height="48" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="438" y="264" text-anchor="middle" font-size="12" font-weight="500" fill="#0c4a6e">RoutingStrategy</text>
  <text x="438" y="280" text-anchor="middle" font-size="11" fill="#0369a1">canExecute(fn)?</text>

  <line x1="518" y1="268" x2="548" y2="268" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <rect x="552" y="244" width="156" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="630" y="264" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">FunctionHandler</text>
  <text x="630" y="280" text-anchor="middle" font-size="11" fill="#16a34a">execute()</text>

  <!-- After annotation (green) -->
  <rect x="20" y="314" width="688" height="36" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="364" y="331" text-anchor="middle" font-size="11" fill="#16a34a">AFTER: Provider matches both slot: and capability: — Worker carries the right function type</text>
  <text x="364" y="345" text-anchor="middle" font-size="11" fill="#16a34a">CaseHubRegistry auto-creates CaseHub for every registered definition</text>

  <!-- Legend -->
  <rect x="20" y="368" width="12" height="12" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="38" y="379" font-size="11" fill="#64748b">SPI extension point</text>
  <rect x="170" y="368" width="12" height="12" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="188" y="379" font-size="11" fill="#64748b">Handler (exists, works)</text>
  <rect x="340" y="368" width="12" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="358" y="379" font-size="11" fill="#64748b">Infrastructure</text>
</svg>
